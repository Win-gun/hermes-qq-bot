name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:social
      - run: npm run test:reply
      - run: npm run test:agent
      - run: npm run test:backup
      - run: npm run test:web-host
      - run: npm run web:release:check
      - run: npm run source:preview
      - run: npm audit --omit=dev --audit-level=low
