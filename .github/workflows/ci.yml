name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:audit
      - run: npm run test:memory
      - run: npm run test:memory-guards
      - run: npm run test:memory-verification
      - run: npm run test:social-agent
      - run: npm run test:discovery
      - run: npm run test:kernel
      - run: npm run test:retrieval
      - run: npm run test:social
      - run: npm run test:reply
      - run: npm run test:text-completion
      - run: npm run test:accounts
        timeout-minutes: 4
        env:
          HERMES_QQ_TEST_TIMING: '1'
      - run: npm run test:account-isolation
      - run: npm run test:features
      - run: npm run test:api-center
      - run: npm run test:bot-commands
      - run: npm run test:config-revision
      - run: npm run test:console
      - run: npm run test:agent
      - run: npm run test:backup
      - run: npm run test:web-host
      - run: npm run web:release:check
      - run: npm run source:preview
      - run: npm audit --omit=dev --audit-level=low
